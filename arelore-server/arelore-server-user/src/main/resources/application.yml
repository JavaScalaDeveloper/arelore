# =====================================================
# Arelore Server User Service Configuration
# =====================================================
# API 设计规范：
# 1. 禁止使用 RESTful 风格（路径上不允许有参数）
# 2. 所有入参必须通过 @RequestBody 传递（Body 参数）
# 3. 统一使用 POST 方法
# 4. 路径命名规范：/api/user/{操作名}，如 /api/user/list
# =====================================================

server:
  port: 8081

spring:
  application:
    name: arelore-server-user
  profiles:
    # 支持通过环境变量切换配置文件：
    # test -> application-test.yml
    # pre  -> application-pre.yml
    # prd  -> application-prd.yml
    active: ${SPRING_PROFILES_ACTIVE:test}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  datasource:
    education:
      url: jdbc:mysql://book-n5095:3306/arelore_education?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
    user:
      url: jdbc:mysql://book-n5095:3306/arelore_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.arelore.server.user: DEBUG

# =====================================================
# 微信登录配置
# =====================================================
wechat:
  # 微信公众号 AppID（已填写）
  appid: xxx
  
  # 微信授权回调地址（需要 URL 编码，并在微信开放平台配置白名单）
  # ⚠️ 注意：必须替换为真实域名，本地测试可用 ngrok
  # 原始地址：https://yourdomain.com/api/user/auth/wechat/callback
  redirect-uri: http%3a%2f%2fyoursite.com%2fcallback
  
  # 授权作用域（固定为 snsapi_login - 网页授权登录）
  scope: snsapi_login

  # 小程序登录（code2session）配置：
  # 建议通过环境变量注入，不在仓库明文保存
  mini:
    appid: ${WECHAT_MINI_APPID:}
    secret: ${WECHAT_MINI_SECRET:}

# =====================================================
# 移动端 H5 测试登录配置
# =====================================================
mobile:
  test-login:
    username: testuser
    password: 123456

# =====================================================
# 阿里云短信验证码（Dypnsapi）
# 说明：
# 1) access-key-id / access-key-secret 建议通过环境变量注入，不在仓库明文保存
# 2) 若未配置 AK/SK，代码会回退 DefaultCredentialProvider（实例角色/默认凭证链）
# =====================================================
aliyun:
  sms:
    enabled: true
    region: cn-hangzhou
    endpoint: dypnsapi.aliyuncs.com
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    sign-name: "速通互联验证码"
    template-code: "100001"
    valid-minutes: 5


