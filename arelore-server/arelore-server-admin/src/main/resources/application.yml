# =====================================================
# Arelore Server Admin Service Configuration
# =====================================================
# API 设计规范：
# 1. 禁止使用 RESTful 风格（路径上不允许有参数）
# 2. 所有入参必须通过 @RequestBody 传递（Body 参数）
# 3. 统一使用 POST 方法
# 4. 路径命名规范：/api/admin/{操作名}，如 /api/admin/login
# =====================================================

server:
  port: 8082

spring:
  application:
    name: arelore-server-admin
  profiles:
    # 支持通过环境变量切换配置文件：
    # test -> application-test.yml
    # pre  -> application-pre.yml
    # prd  -> application-prd.yml
    active: ${SPRING_PROFILES_ACTIVE:test}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  datasource:
    education:
      url: jdbc:mysql://book-n5095:3306/arelore_education?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        max-lifetime: 580000
        idle-timeout: 520000
        connection-timeout: 30000
        keepalive-time: 60000
    user:
      url: jdbc:mysql://book-n5095:3306/arelore_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        max-lifetime: 580000
        idle-timeout: 520000
        connection-timeout: 30000
        keepalive-time: 60000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 单词配图图库（仅 Pixabay）
# 文档：https://pixabay.com/api/docs/
# 本地释义 TTS：OpenAI 兼容 /v1/audio/speech（默认本机 Qwen3-TTS）
arelore:
  word:
    image:
      pixabay-api-key: ${ARELORE_PIXABAY_API_KEY:57972734-fe8fdef2090500bc180d4cfb9}
      min-count: 4
      search-count: 12
  tts:
    qwen:
      enabled: ${ARELORE_TTS_QWEN_ENABLED:true}
      # 用 127.0.0.1，避免 localhost→IPv6 与 uvicorn 不一致
      base-url: ${ARELORE_TTS_QWEN_BASE_URL:http://127.0.0.1:8880}
      model: ${ARELORE_TTS_QWEN_MODEL:qwen3-tts}
      # 与 curl/README 一致；alloy 会映射到 Vivian
      voice: ${ARELORE_TTS_QWEN_VOICE:alloy}
      response-format: mp3
      timeout-seconds: 180

logging:
  level:
    root: INFO
    com.arelore.server.admin: DEBUG
