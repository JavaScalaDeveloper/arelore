# =====================================================
# Arelore Server Admin Service Configuration
# =====================================================
# API 设计规范：
# 1. 禁止使用 RESTful 风格（路径上不允许有参数）
# 2. 所有入参必须通过 @RequestBody 传递（Body 参数）
# 3. 统一使用 POST 方法
# 4. 路径命名规范：/api/admin/{操作名}，如 /api/admin/login
# =====================================================

server:
  port: 8082

spring:
  application:
    name: arelore-server-admin
  profiles:
    # 支持通过环境变量切换配置文件：
    # test -> application-test.yml
    # pre  -> application-pre.yml
    # prd  -> application-prd.yml
    active: ${SPRING_PROFILES_ACTIVE:test}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  datasource:
    education:
      url: jdbc:mysql://book-n5095:3306/arelore_education?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        max-lifetime: 580000
        idle-timeout: 520000
        connection-timeout: 30000
        keepalive-time: 60000
        # 固定会话东八区，避免机器 UTC 时 CURRENT_TIMESTAMP 差 8 小时
        connection-init-sql: SET time_zone = '+08:00'
    user:
      url: jdbc:mysql://book-n5095:3306/arelore_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        max-lifetime: 580000
        idle-timeout: 520000
        connection-timeout: 30000
        keepalive-time: 60000
        connection-init-sql: SET time_zone = '+08:00'

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 单词配图图库（仅 Pixabay）
# 文档：https://pixabay.com/api/docs/
# 释义 TTS：Edge TTS（微软在线神经音色 + speak.py 再压 32k/16kHz）
arelore:
  word:
    image:
      pixabay-api-key: ${ARELORE_PIXABAY_API_KEY:57972734-fe8fdef2090500bc180d4cfb9}
      min-count: 4
      search-count: 12
  tts:
    edge:
      enabled: ${ARELORE_TTS_EDGE_ENABLED:true}
      python: ${ARELORE_TTS_EDGE_PYTHON:python}
      # al-basic-components/local/edge-tts/speak.py（会 ffmpeg 再压成小体积 mp3）
      script: ${ARELORE_TTS_EDGE_SCRIPT:C:/Workspaces/person/al-basic-components/local/edge-tts/speak.py}
      # 中文释义朗读：晓晓（温柔女声）
      voice: ${ARELORE_TTS_EDGE_VOICE:zh-CN-XiaoxiaoNeural}
      bitrate: ${ARELORE_TTS_EDGE_BITRATE:32k}
      sample-rate: ${ARELORE_TTS_EDGE_SAMPLE_RATE:16000}
      timeout-seconds: ${ARELORE_TTS_EDGE_TIMEOUT_SECONDS:120}
      max-attempts: ${ARELORE_TTS_EDGE_MAX_ATTEMPTS:3}
      retry-delay-ms: ${ARELORE_TTS_EDGE_RETRY_DELAY_MS:1500}
      # 同时跑 speak.py 的上限（在线接口可高于本机 Qwen）
      in-flight: ${ARELORE_TTS_EDGE_IN_FLIGHT:8}
      # 批量任务线程数
      parallelism: ${ARELORE_TTS_EDGE_PARALLELISM:8}
    # 保留本机 Qwen3 配置（当前释义语音已改走 edge，不再生效）
    qwen:
      enabled: ${ARELORE_TTS_QWEN_ENABLED:false}
      base-url: ${ARELORE_TTS_QWEN_BASE_URL:http://127.0.0.1:8880}
      model: ${ARELORE_TTS_QWEN_MODEL:qwen3-tts}
      voice: ${ARELORE_TTS_QWEN_VOICE:Serena}
      speed: ${ARELORE_TTS_QWEN_SPEED:1.0}
      response-format: mp3
      timeout-seconds: ${ARELORE_TTS_QWEN_TIMEOUT_SECONDS:1800}
      max-attempts: ${ARELORE_TTS_QWEN_MAX_ATTEMPTS:1}
      retry-delay-ms: ${ARELORE_TTS_QWEN_RETRY_DELAY_MS:3000}
      in-flight: ${ARELORE_TTS_QWEN_IN_FLIGHT:4}
      parallelism: ${ARELORE_TTS_QWEN_PARALLELISM:4}

logging:
  level:
    root: INFO
    com.arelore.server.admin: DEBUG
