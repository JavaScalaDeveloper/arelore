# =====================================================
# Arelore Server Admin Service Configuration
# =====================================================
# API 设计规范：
# 1. 禁止使用 RESTful 风格（路径上不允许有参数）
# 2. 所有入参必须通过 @RequestBody 传递（Body 参数）
# 3. 统一使用 POST 方法
# 4. 路径命名规范：/api/admin/{操作名}，如 /api/admin/login
# =====================================================

server:
  port: 8082

spring:
  application:
    name: arelore-server-admin
  profiles:
    # 支持通过环境变量切换配置文件：
    # test -> application-test.yml
    # pre  -> application-pre.yml
    # prd  -> application-prd.yml
    active: ${SPRING_PROFILES_ACTIVE:test}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  datasource:
    education:
      url: jdbc:mysql://book-n5095:3306/arelore_education?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        max-lifetime: 580000
        idle-timeout: 520000
        connection-timeout: 30000
        keepalive-time: 60000
        # 固定会话东八区，避免机器 UTC 时 CURRENT_TIMESTAMP 差 8 小时
        connection-init-sql: SET time_zone = '+08:00'
    user:
      url: jdbc:mysql://book-n5095:3306/arelore_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
      username: root
      password: 123456
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        max-lifetime: 580000
        idle-timeout: 520000
        connection-timeout: 30000
        keepalive-time: 60000
        connection-init-sql: SET time_zone = '+08:00'

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 单词配图图库（仅 Pixabay）
# 文档：https://pixabay.com/api/docs/
# 本地释义 TTS：OpenAI 兼容 /v1/audio/speech（默认本机 Qwen3-TTS）
arelore:
  word:
    image:
      pixabay-api-key: ${ARELORE_PIXABAY_API_KEY:57972734-fe8fdef2090500bc180d4cfb9}
      min-count: 4
      search-count: 12
  tts:
    qwen:
      enabled: ${ARELORE_TTS_QWEN_ENABLED:true}
      # 用 127.0.0.1，避免 localhost→IPv6 与 uvicorn 不一致
      base-url: ${ARELORE_TTS_QWEN_BASE_URL:http://127.0.0.1:8880}
      model: ${ARELORE_TTS_QWEN_MODEL:qwen3-tts}
      # Serena 音色；speed 建议 1.0（>1 易引入加速伪影/底噪）
      voice: ${ARELORE_TTS_QWEN_VOICE:Serena}
      speed: ${ARELORE_TTS_QWEN_SPEED:1.0}
      response-format: mp3
      # 单次 HTTP 读超时（仅覆盖实际合成，不含客户端排队）；默认 30 分钟
      timeout-seconds: ${ARELORE_TTS_QWEN_TIMEOUT_SECONDS:1800}
      # 读超时 / 连接重置等瞬时失败时的总尝试次数（含首次）
      max-attempts: ${ARELORE_TTS_QWEN_MAX_ATTEMPTS:1}
      retry-delay-ms: ${ARELORE_TTS_QWEN_RETRY_DELAY_MS:3000}
      # 同时对 TTS 发 HTTP 的上限，应对齐服务端 TTS_MAX_CONCURRENT（默认 1）
      in-flight: ${ARELORE_TTS_QWEN_IN_FLIGHT:1}
      # 批量任务线程数：>1 时可在「写库」与「下一词排队等 TTS」之间重叠
      parallelism: ${ARELORE_TTS_QWEN_PARALLELISM:1}

logging:
  level:
    root: INFO
    com.arelore.server.admin: DEBUG
