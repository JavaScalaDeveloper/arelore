<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- 默认：官网 Arelore icon；/word 路由下脚本会切到墨鱼背词 icon -->
    <link id="app-favicon-ico" rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico?v=2" />
    <link id="app-favicon" rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png?v=2" />
    <link id="app-favicon-32" rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png?v=2" />
    <link id="app-apple-touch" rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="theme-color" content="#001529" />
    <meta name="description" content="Arelore - 创新技术，引领未来" />
    
    <!-- 禁用缓存，确保每次加载最新代码 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Arelore - 官方网站</title>
    <!-- /word 首屏 SEO + favicon：在 React 加载前写入，便于爬虫与标签页展示 -->
    <script>
      (function () {
        try {
          var path = location.pathname.replace(/^\/(zh-cn|en-us)(?=\/|$)/, '') || '/';
          var base = '%PUBLIC_URL%' || '';
          if (base === '%PUBLIC_URL%') base = '';
          var isWord = path === '/word' || path.indexOf('/word/') === 0;
          var favIco = document.getElementById('app-favicon-ico');
          var fav = document.getElementById('app-favicon');
          var fav32 = document.getElementById('app-favicon-32');
          var apple = document.getElementById('app-apple-touch');
          if (isWord) {
            document.title = '墨鱼背词';
            if (favIco) favIco.setAttribute('href', base + '/favicon-word.ico?v=2');
            if (fav) fav.setAttribute('href', base + '/favicon-word.png?v=2');
            if (fav32) fav32.setAttribute('href', base + '/favicon-word-32.png?v=2');
            if (apple) apple.setAttribute('href', base + '/apple-touch-icon-word.png?v=2');
            var desc = document.querySelector('meta[name="description"]');
            if (desc) {
              desc.setAttribute(
                'content',
                '墨鱼背词是面向碎片时间的英语单词学习工具，支持看词识意、听力跟读与听写默写。可在通勤、排队、讲座间隙用听觉练习巩固词汇与拼写，配合词书与复习计划稳步提升单词量。'
              );
            }
            var kw = document.createElement('meta');
            kw.setAttribute('name', 'keywords');
            kw.setAttribute(
              'content',
              '墨鱼背词,英语单词学习,在线背单词,单词听写,听力背单词,碎片时间学英语,英语词汇记忆,看词识意,单词复习计划,英语拼写练习'
            );
            document.head.appendChild(kw);
          } else {
            if (favIco) favIco.setAttribute('href', base + '/favicon.ico?v=2');
            if (fav) fav.setAttribute('href', base + '/favicon.png?v=2');
            if (fav32) fav32.setAttribute('href', base + '/favicon-32.png?v=2');
            if (apple) apple.setAttribute('href', base + '/apple-touch-icon.png?v=2');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
